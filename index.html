<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Shigaku — My Study Room</title>
<style>
  /* 以前のシンプルなログイン画面のデザイン */
  body { display:flex; justify-content:center; align-items:center; height:100vh; background:#f7f8fb; }
  .login-container { background:white; padding:20px; border-radius:8px; border:1px solid #ccc; }
  input { padding:8px; margin-right:5px; border:1px solid #ccc; }
</style>
</head>
<body>

<div class="login-container">
  <input type="text" id="id" placeholder="ID">
  <input type="password" id="pass" placeholder="パスワード">
  <button onclick="checkLogin()">ログイン</button>
</div>

<script>
  // ここに以前設定していたIDとパスワードを記述します
  // ※実際のID・パスワードはご自身でここに記入してください
  function checkLogin() {
    const id = document.getElementById('id').value;
    const pass = document.getElementById('pass').value;
    
    // 先生が以前設定されていたIDとパスワードのペアを判定します
    if (id === "shigaku" && pass === "1234") { 
      window.location.href = "mystudyindex.html"; 
    } else {
      alert("IDまたはパスワードが違います");
    }
  }
</script>
</body>
</html>
