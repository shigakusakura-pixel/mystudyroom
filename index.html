<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Shigaku — My Study Room</title>
<style>
  /* 以前のログイン画面とポータル画面のデザインを一括してここに記述します */
  #login-screen { display: flex; }
  #main-content { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <input type="text" id="id-input" placeholder="ID">
  <input type="password" id="pass-input" placeholder="パスワード">
  <button id="login-btn">ログイン</button>
</div>

<div id="main-content">
  <div id="personal-message-area">読み込み中...</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

  // ... (Firebase設定は既存のものを使用) ...

  const auth = getAuth();

  // ログイン後の処理
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      
      // データベースから個別のメッセージを取得して表示
      const studentId = user.email.split('@')[0];
      const docSnap = await getDoc(doc(db, "students", studentId));
      if (docSnap.exists()) {
        document.getElementById('personal-message-area').innerHTML = docSnap.data().message;
      }
    }
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const id = document.getElementById('id-input').value;
    const pass = document.getElementById('pass-input').value;
    await signInWithEmailAndPassword(auth, id + "@mystudy.dummy.com", pass);
  });
</script>
</body>
</html>
