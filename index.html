<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>My Study Room</title>
</head>
<body>
  <h1>My Study Room</h1>
  <p>読み込み中...</p>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBQjnlOfeVvWQJHDxGE9cq-jGsYF3uo0PY",
      authDomain: "mystudy-portal.firebaseapp.com",
      projectId: "mystudy-portal",
      storageBucket: "mystudy-portal.firebasestorage.app",
      messagingSenderId: "62253255474",
      appId: "1:62253255474:web:817a3cbd1ab3ea63e7e52b"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // ログイン処理を排除し、アクセスログだけを送るシンプルな状態
    async function init() {
      try {
        await addDoc(collection(db, "access_logs"), {
          studentId: "debug",
          subject: "テストアクセス",
          accessedAt: serverTimestamp()
        });
        document.body.innerHTML = "<h1>正常にFirebaseに接続できました</h1><p>ブラウザで正しく動作しています。</p>";
      } catch (e) {
        document.body.innerHTML = "<h1>エラーが発生しました</h1><p>" + e.message + "</p>";
      }
    }
    init();
  </script>
</body>
</html>
