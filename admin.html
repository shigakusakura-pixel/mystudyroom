<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myスタディ — 志学ゼミナール 生徒管理ダッシュボード</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f6f9; color: #333; padding: 30px; }
  .container { max-width: 1000px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
  h2 { color: #1a2e4a; margin-bottom: 20px; border-bottom: 2px solid #e2e6ee; padding-bottom: 10px; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 14px; text-align: left; border-bottom: 1px solid #e2e6ee; }
  th { background-color: #2963B1; color: white; user-select: none; }
  th.sortable { cursor: pointer; position: relative; }
  th.sortable:hover { background-color: #3572c0; }
  
  tr.student-row { cursor: pointer; transition: background-color 0.2s; }
  tr.student-row:hover { background-color: #eef2f7; }
  tr.zero-activity { background-color: #fff0f0; color: #c0392b; font-weight: bold; }
  tr.zero-activity:hover { background-color: #ffe4e4; }
  
  .student-name-text { font-weight: 600; font-size: 1.05em; color: #222; letter-spacing: 0.05em; }
  
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85em; }
  .badge-alert { background: #e74c3c; color: white; }
  .student-id-sub { font-size: 0.75em; color: #888; font-weight: normal; display: block; margin-top: 2px; }
  .loading { text-align: center; padding: 40px; font-size: 1.2em; color: #666; }

  /* モーダル */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
  .modal-content { background: white; width: 90%; max-width: 500px; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.5em; cursor: pointer; color: #888; }
  .modal-close:hover { color: #333; }
  .modal-header { border-bottom: 2px solid #1a2e4a; padding-bottom: 10px; margin-bottom: 15px; }
  .modal-stat-box { display: flex; justify-content: space-between; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  .stat-item { text-align: center; width: 48%; }
  .stat-num { font-size: 1.8em; font-weight: bold; color: #1a2e4a; }
  
  .subject-bar-container { margin-bottom: 10px; }
  .subject-name { font-size: 0.85em; color: #444; margin-bottom: 4px; display: flex; justify-content: space-between; font-weight: bold; }
  .bar-bg { width: 100%; background-color: #e2e6ee; border-radius: 6px; height: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease-out; }

  .recent-logs { font-size: 0.9em; max-height: 150px; overflow-y: auto; background: #fdfdfd; border: 1px solid #eee; padding: 10px; border-radius: 6px; }
  .recent-logs li { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #ccc; list-style: none; }
  
  .message-box { margin-top: 20px; background: #eef2f7; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db; }
  .message-box textarea { width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 8px; margin-bottom: 8px; resize: vertical; box-sizing: border-box; }
  .send-btn { background: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .send-btn:hover { background: #2980b9; }
</style>
</head>
<body>

<div class="container">
  <h2>📊 生徒学習状況リアルタイム分析</h2>
  <p style="font-size: 0.9em; color: #666;">※生徒の行をクリックすると、個人の詳細カルテが表示されます。</p>
  
  <div id="loading-view" class="loading">⏳ Firebaseから学習記録を読み込んで集計中...</div>
  
  <table id="student-table" style="display: none;">
    <thead>
      <tr>
        <th>生徒名</th>
        <th id="sort-7days" class="sortable">過去7日間の学習回数 ↕</th>
        <th>過去30日間の学習回数</th>
        <th>最終学習日時</th>
      </tr>
    </thead>
    <tbody id="student-list"></tbody>
  </table>
</div>

<div id="student-modal" class="modal-overlay">
  <div class="modal-content">
    <span class="modal-close" id="modal-close-btn">&times;</span>
    <div class="modal-header">
      <h3 id="modal-name" style="margin: 0; color: #1a2e4a;">生徒名</h3>
      <span id="modal-id" class="student-id-sub">studentId</span>
    </div>
    
    <div class="modal-stat-box">
      <div class="stat-item">
        <div style="font-size: 0.8em; color: #666;">過去7日間</div>
        <div class="stat-num"><span id="modal-count7">0</span>回</div>
      </div>
      <div class="stat-item">
        <div style="font-size: 0.8em; color: #666;">過去30日間</div>
        <div class="stat-num"><span id="modal-count30">0</span>回</div>
      </div>
    </div>
    
    <h4 style="margin: 15px 0 10px 0; font-size: 1em; color: #333;">📊 教科別バランス（過去30日間）</h4>
    <div id="modal-subjects-container" style="margin-bottom: 20px;"></div>

    <h4 style="margin: 10px 0 5px 0; font-size: 1em; color: #333;">📝 最近の学習履歴（最新5件）</h4>
    <div id="modal-history-loading" style="font-size: 0.8em; color: #888; display: none;">履歴を読み込み中...</div>
    <div class="recent-logs"><ul id="modal-recent-list"></ul></div>

    <div class="message-box">
      <h4 style="margin: 0 0 10px 0; font-size: 1em; color: #1a2e4a;">💬 この生徒にメッセージを送る</h4>
      <textarea id="teacher-msg-input" rows="2" placeholder="例：今週はよく頑張っているね！土曜特訓もこの調子で！"></textarea>
      <button id="send-msg-btn" class="send-btn">送信する</button>
      <span id="msg-send-status" style="margin-left: 10px; font-size: 0.85em; color: #e74c3c;"></span>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQjnlOfeVvWQJHDxGE9cq-jGsYF3uo0PY",
    authDomain: "mystudy-portal.firebaseapp.com",
    projectId: "mystudy-portal",
    storageBucket: "mystudy-portal.firebasestorage.app",
    messagingSenderId: "62253255474",
    appId: "1:62253255474:web:817a3cbd1ab3ea63e7e52b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

 const STUDENT_RECORDS = {
    "student001@shigaku.local": "後田 莉乃葉",
    "teacher@shigaku.local": "日野 妙三",
    "sky@shigaku.local": "Sky",
    "guest": "ゲストユーザー",
    "student002@shigaku.local": "辻 結香",
    "student003@shigaku.local": "辻 沙香",
    "student004@shigaku.local": "二ノ宮 愛彩",
    "student005@shigaku.local": "丸目 妃織",
    "student006@shigaku.local": "久保 善光",
    "student007@shigaku.local": "新留 らな",
    "student008@shigaku.local": "溝口 ゆうか",
    "student009@shigaku.local": "川原 美桜",
    "student009@shigaku.local": "藤中 敬斗",
   "student011@shigaku.local": "吉元 碧唯",
    "student012@shigaku.local": "中 凜華"
   };
  
  const REGISTERED_STUDENTS = Object.keys(STUDENT_RECORDS);

  let currentModalStudentId = ""; 
  let allRecentRecords = []; // メモリ上に全履歴を保持して高速化

  async function loadAndAggregateData() {
    try {
      const now = new Date();
      const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

      const q = query(collection(db, "learning_records"), where("timestamp", ">=", thirtyDaysAgo));
      const querySnapshot = await getDocs(q);

      allRecentRecords = []; 
      const studentMap = {};
      REGISTERED_STUDENTS.forEach(id => {
        studentMap[id] = { id: id, count7: 0, count30: 0, lastActive: null, subjects: {} };
      });

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        allRecentRecords.push(data); // カルテ表示用に保存

        let sId = data.studentId;

        // ★修正箇所：今日の途中から発生した「IDの揺れ」を完全に統一・統合します
        if (sId) {
          if (sId === "ゲスト" || sId === "guest") {
            sId = "guest";
          } else if (!sId.includes('@')) {
            sId = sId + '@shigaku.local'; // student001 を student001@shigaku.local に変換して合体
          }
        } else {
          sId = "unknown";
        }

        if (!studentMap[sId]) studentMap[sId] = { id: sId, count7: 0, count30: 0, lastActive: null, subjects: {} };

        let timestampObj = null;
        if (data.timestamp) {
            if (typeof data.timestamp.toDate === 'function') {
                timestampObj = data.timestamp.toDate(); 
            } else {
                timestampObj = new Date(data.timestamp); 
                if (isNaN(timestampObj.getTime())) timestampObj = null; 
            }
        }

        if (timestampObj) {
          studentMap[sId].count30++;
          if (timestampObj >= sevenDaysAgo) studentMap[sId].count7++;
          if (!studentMap[sId].lastActive || timestampObj > studentMap[sId].lastActive) studentMap[sId].lastActive = timestampObj;
          
          const subjectName = data.subject || 'その他/不明';
          if (!studentMap[sId].subjects[subjectName]) studentMap[sId].subjects[subjectName] = 0;
          studentMap[sId].subjects[subjectName]++;
        }
      });

      const studentList = Object.values(studentMap);
      sortAndRender(studentList, 'count7');

      let isAsc = false;
      document.getElementById('sort-7days').addEventListener('click', () => {
        isAsc = !isAsc;
        sortAndRender(studentList, 'count7', isAsc);
      });

      document.getElementById('loading-view').style.display = 'none';
      document.getElementById('student-table').style.display = 'table';
    } catch (e) {
      console.error("エラー:", e);
      document.getElementById('loading-view').textContent = "❌ 読み込みエラーが発生しました。詳細: " + e.message;
    }
  }

  function sortAndRender(list, key, asc = false) {
    list.sort((a, b) => asc ? a[key] - b[key] : b[key] - a[key]);
    const tbody = document.getElementById('student-list');
    tbody.innerHTML = '';
    list.forEach(student => {
      const tr = document.createElement('tr');
      tr.className = 'student-row';
      if (student.count30 === 0) tr.classList.add('zero-activity');

      const studentName = STUDENT_RECORDS[student.id] || student.id;
      const dateStr = student.lastActive ? student.lastActive.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '---';

      tr.innerHTML = `<td><span class="student-name-text">${studentName}</span><span class="student-id-sub">${student.id}</span></td>
                      <td>${student.count7} 回</td><td>${student.count30} 回</td>
                      <td>${dateStr} ${student.count30 === 0 ? '<span class="badge badge-alert">未受講</span>' : ''}</td>`;
      
      tr.addEventListener('click', () => openStudentModal(student, studentName));
      tbody.appendChild(tr);
    });
  }

  const modal = document.getElementById('student-modal');
  const closeBtn = document.getElementById('modal-close-btn');
  closeBtn.onclick = () => modal.style.display = "none";
  window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; }

  function openStudentModal(student, studentName) {
    currentModalStudentId = student.id; 
    
    document.getElementById('modal-name').textContent = studentName;
    document.getElementById('modal-id').textContent = student.id;
    document.getElementById('modal-count7').textContent = student.count7;
    document.getElementById('modal-count30').textContent = student.count30;
    
    document.getElementById('teacher-msg-input').value = "";
    document.getElementById('msg-send-status').textContent = "";

    const subjectsContainer = document.getElementById('modal-subjects-container');
    subjectsContainer.innerHTML = '';
    if (student.count30 === 0) {
      subjectsContainer.innerHTML = '<div style="color: #888; font-size: 0.9em;">データがありません</div>';
    } else {
      const sortedSubjects = Object.entries(student.subjects).sort((a, b) => b[1] - a[1]);
      sortedSubjects.forEach(([subjName, count]) => {
        const percentage = Math.round((count / student.count30) * 100);
        let barColor = "#95a5a6";
        if (subjName.includes("英語")) barColor = "#e74c3c";
        else if (subjName.includes("数学") || subjName.includes("算数")) barColor = "#3498db";
        else if (subjName.includes("国語")) barColor = "#e67e22";
        else if (subjName.includes("理科")) barColor = "#2ecc71";
        else if (subjName.includes("社会")) barColor = "#9b59b6";

        subjectsContainer.innerHTML += `
          <div class="subject-bar-container">
            <div class="subject-name"><span>${subjName}</span><span>${count}回 <span style="color:#888; font-size:0.9em; font-weight:normal;">(${percentage}%)</span></span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: ${percentage}%; background-color: ${barColor};"></div></div>
          </div>`;
      });
    }

    const historyList = document.getElementById('modal-recent-list');
    historyList.innerHTML = '';
    modal.style.display = "flex";

    // ★修正箇所：旧IDと新IDの両方の履歴を統合して表示します
    try {
      const shortId = student.id.includes('@') ? student.id.split('@')[0] : student.id;

      // メモリ上の全記録から、該当生徒のものだけを旧形式・新形式問わず集める
      const myRecords = allRecentRecords.filter(data => {
         const sId = data.studentId;
         if (!sId) return false;
         return sId === student.id || sId === shortId || (student.id === "guest" && (sId === "ゲスト" || sId === "guest"));
      });

      // 日付が新しい順に並び替え
      myRecords.sort((a, b) => {
         let timeA = 0, timeB = 0;
         if (a.timestamp) timeA = typeof a.timestamp.toDate === 'function' ? a.timestamp.toDate().getTime() : new Date(a.timestamp).getTime();
         if (b.timestamp) timeB = typeof b.timestamp.toDate === 'function' ? b.timestamp.toDate().getTime() : new Date(b.timestamp).getTime();
         return timeB - timeA;
      });

      const top5 = myRecords.slice(0, 5);

      if (top5.length === 0) {
        historyList.innerHTML = '<li style="color:#888;">学習履歴がありません</li>';
        return;
      }

      top5.forEach((data) => {
        let dateObj = null;
        if (data.timestamp) {
            if (typeof data.timestamp.toDate === 'function') dateObj = data.timestamp.toDate();
            else dateObj = new Date(data.timestamp);
        }

        const dateStr = (dateObj && !isNaN(dateObj.getTime())) ? dateObj.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '不明';
        const subject = data.subject || '教科不明';
        const unit = data.unit || '';
        historyList.innerHTML += `<li><span style="color:#666; font-size:0.9em; margin-right:10px;">${dateStr}</span> <strong>${subject}</strong> <br><span style="font-size:0.9em; color:#444;">${unit}</span></li>`;
      });
    } catch (e) {
      console.error(e);
    }
  }

  document.getElementById('send-msg-btn').addEventListener('click', async () => {
    const msgInput = document.getElementById('teacher-msg-input');
    const statusText = document.getElementById('msg-send-status');
    const message = msgInput.value.trim();

    if (!message) {
      statusText.textContent = "メッセージを入力してください";
      return;
    }

    statusText.style.color = "#333";
    statusText.textContent = "送信中...";

    try {
      await addDoc(collection(db, "teacher_messages"), {
        studentId: currentModalStudentId,
        message: message,
        isRead: false,
        timestamp: serverTimestamp()
      });
      statusText.style.color = "#27ae60";
      statusText.textContent = "✅ 送信しました！";
      msgInput.value = ""; 
    } catch (e) {
      console.error(e);
      statusText.style.color = "#e74c3c";
      statusText.textContent = "❌ 送信に失敗しました";
    }
  });

  loadAndAggregateData();
</script>
</body>
</html>
