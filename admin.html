<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myスタディ — 志学ゼミナール 生徒管理ダッシュボード</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f6f9; color: #333; padding: 30px; }
  .container { max-width: 1000px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
  h2 { color: #1a2e4a; margin-bottom: 20px; border-bottom: 2px solid #e2e6ee; padding-bottom: 10px; }
  
  /* エコモード用スタイル */
  .update-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #e8f0fb; padding: 12px 18px; border-radius: 8px; border: 1px solid #cce0ff; }
  .update-btn { background: #2963B1; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  .update-btn:hover { background: #3572c0; }
  .cache-notice { font-size: 0.9em; color: #444; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 14px; text-align: left; border-bottom: 1px solid #e2e6ee; }
  th { background-color: #2963B1; color: white; user-select: none; }
  th.sortable { cursor: pointer; position: relative; }
  th.sortable:hover { background-color: #3572c0; }
  
  tr.student-row { cursor: pointer; transition: background-color 0.2s; }
  tr.student-row:hover { background-color: #eef2f7; }
  tr.zero-activity { background-color: #fff0f0; color: #c0392b; font-weight: bold; }
  tr.zero-activity:hover { background-color: #ffe4e4; }
  
  .student-name-text { font-weight: 600; font-size: 1.05em; color: #222; letter-spacing: 0.05em; }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85em; }
  .badge-alert { background: #e74c3c; color: white; }
  .student-id-sub { font-size: 0.75em; color: #888; font-weight: normal; display: block; margin-top: 2px; }
  .loading { text-align: center; padding: 40px; font-size: 1.2em; color: #666; }

  /* モーダル */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
  .modal-content { background: white; width: 90%; max-width: 500px; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.5em; cursor: pointer; color: #888; }
  .modal-close:hover { color: #333; }
  .modal-header { border-bottom: 2px solid #1a2e4a; padding-bottom: 10px; margin-bottom: 15px; }
  .modal-stat-box { display: flex; justify-content: space-between; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  .stat-item { text-align: center; width: 48%; }
  .stat-num { font-size: 1.8em; font-weight: bold; color: #1a2e4a; }
  
  .subject-bar-container { margin-bottom: 10px; }
  .subject-name { font-size: 0.85em; color: #444; margin-bottom: 4px; display: flex; justify-content: space-between; font-weight: bold; }
  .bar-bg { width: 100%; background-color: #e2e6ee; border-radius: 6px; height: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease-out; }

  .recent-logs { font-size: 0.9em; max-height: 150px; overflow-y: auto; background: #fdfdfd; border: 1px solid #eee; padding: 10px; border-radius: 6px; }
  .recent-logs li { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #ccc; list-style: none; }
  
  .message-box { margin-top: 20px; background: #eef2f7; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db; }
  .message-box textarea { width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 8px; margin-bottom: 8px; resize: vertical; box-sizing: border-box; }
  .send-btn { background: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .send-btn:hover { background: #2980b9; }
</style>
</head>
<body>

<div class="container">
  <h2>📊 生徒学習状況リアルタイム分析</h2>
  
  <!-- ★エコモード案内バー -->
  <div class="update-bar">
    <div class="cache-notice">
      💡 <strong>通信量節約モード稼働中</strong>（Firebaseへの通信を抑えています）<br>
      データ取得時刻: <strong id="last-update-time" style="color:#e74c3c;">未取得</strong>
    </div>
    <button id="force-update-btn" class="update-btn">🔄 最新データに更新</button>
  </div>
  
  <p style="font-size: 0.9em; color: #666;">※生徒の行をクリックすると、個人の詳細カルテが表示されます。</p>
  
  <div id="loading-view" class="loading">⏳ データを集計中...</div>
  
  <table id="student-table" style="display: none;">
    <thead>
      <tr>
        <th>生徒名</th>
        <th id="sort-7days" class="sortable">過去7日間の学習回数 ↕</th>
        <th>過去30日間の学習回数</th>
        <th>最終学習日時</th>
      </tr>
    </thead>
    <tbody id="student-list"></tbody>
  </table>
</div>

<div id="student-modal" class="modal-overlay">
  <div class="modal-content">
    <span class="modal-close" id="modal-close-btn">&times;</span>
    <div class="modal-header">
      <h3 id="modal-name" style="margin: 0; color: #1a2e4a;">生徒名</h3>
      <span id="modal-id" class="student-id-sub">studentId</span>
    </div>
    
    <div class="modal-stat-box">
      <div class="stat-item">
        <div style="font-size: 0.8em; color: #666;">過去7日間</div>
        <div class="stat-num"><span id="modal-count7">0</span>回</div>
      </div>
      <div class="stat-item">
        <div style="font-size: 0.8em; color: #666;">過去30日間</div>
        <div class="stat-num"><span id="modal-count30">0</span>回</div>
      </div>
    </div>
    
    <h4 style="margin: 15px 0 10px 0; font-size: 1em; color: #333;">📊 教科別バランス（過去30日間）</h4>
    <div id="modal-subjects-container" style="margin-bottom: 20px;"></div>

    <h4 style="margin: 10px 0 5px 0; font-size: 1em; color: #333;">📝 最近の学習履歴（最新5件）</h4>
    <div id="modal-history-loading" style="font-size: 0.8em; color: #888; display: none;">履歴を読み込み中...</div>
    <div class="recent-logs"><ul id="modal-recent-list"></ul></div>

    <div class="message-box">
      <h4 style="margin: 0 0 10px 0; font-size: 1em; color: #1a2e4a;">💬 メッセージ・プリントを送る</h4>
      
      <div style="margin-bottom: 10px;">
        <select id="msg-target-type" style="padding: 4px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.9em;">
          <option value="individual">表示中の生徒（個人）</option>
          <option value="grade_1">中学1年生 全員</option>
          <option value="grade_2">中学2年生 全員</option>
          <option value="grade_3">中学3年生 全員</option>
          <option value="all">生徒全員</option>
        </select>
      </div>

      <div style="margin-bottom: 12px; padding: 6px 10px; background-color: #ebf5fb; border-left: 4px solid #2980b9; border-radius: 4px;">
        <label for="pdf-upload-input" style="font-size: 0.9em; font-weight: bold; color: #1b4f72;">📄 PDFプリント添付: </label>
        <input type="file" id="pdf-upload-input" accept="application/pdf" style="font-size: 0.85em; cursor: pointer; color: #2c3e50;">
      </div>

      <textarea id="teacher-msg-input" rows="2" placeholder="例：今週はよく頑張っているね！土曜特訓もこの調子で！"></textarea>
      <button id="send-msg-btn" class="send-btn">送信する</button>
      <span id="msg-send-status" style="margin-left: 10px; font-size: 0.85em; color: #e74c3c;"></span>
      
      <!-- ★追加機能：送信済みメッセージの管理エリア -->
      <h4 style="margin: 25px 0 10px 0; font-size: 0.95em; color: #1a2e4a; border-top: 1px dashed #ccc; padding-top: 15px;">🗑️ 送信済みメッセージの管理</h4>
      <div id="sent-messages-list" style="font-size: 0.85em; max-height: 150px; overflow-y: auto; background: #fff; border: 1px solid #ccc; padding: 10px; border-radius: 4px;">
        <div style="color:#888;">読み込み中...</div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  // ★Firestoreの命令に「deleteDoc」と「doc」を追加
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  // ★Storageの命令に「deleteObject」を追加
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQjnlOfeVvWQJHDxGE9cq-jGsYF3uo0PY",
    authDomain: "mystudy-portal.firebaseapp.com",
    projectId: "mystudy-portal",
    storageBucket: "mystudy-portal.firebasestorage.app",
    messagingSenderId: "62253255474",
    appId: "1:62253255474:web:817a3cbd1ab3ea63e7e52b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

const STUDENT_RECORDS = {
    "student001@shigaku.local": { name: "後田 莉乃葉", grade: "grade_2" },
    "tuji@shigaku.local": { name: "辻 結香", grade: "grade_1" },
    "student003@shigaku.local": { name: "辻 沙香", grade: "grade_3" },
    "student004@shigaku.local": { name: "二ノ宮 愛彩", grade: "grade_3" },
    "student005@shigaku.local": { name: "丸目 妃織", grade: "grade_3" },
    "student006@shigaku.local": { name: "久保 善光", grade: "grade_3" },
    "student007@shigaku.local": { name: "新留 らな", grade: "grade_3" },
    "student008@shigaku.local": { name: "溝口 ゆうか", grade: "grade_3" },
    "student009@shigaku.local": { name: "川原 美桜", grade: "grade_3" },
    "student010@shigaku.local": { name: "藤中 敬斗", grade: "grade_3" },
    "yoshi@shigaku.local": { name: "吉元 碧唯", grade: "grade_3" },
    "student012@shigaku.local": { name: "中 凜華", grade: "grade_3" },
    "student013@shigaku.local": { name: "古川 桜汰", grade: "grade_3" },
    "student014@shigaku.local": { name: "橋元 湧", grade: "grade_3" },
    "student015@shigaku.local": { name: "福薗 賢人", grade: "grade_3" },
    "student016@shigaku.local": { name: "宮崎 玲歩", grade: "grade_3" },
    "student017@shigaku.local": { name: "鮫島 蒼侑", grade: "grade_3" },
    "student018@shigaku.local": { name: "長倉 良介", grade: "grade_3" },
    "teacher@shigaku.local": { name: "日野 妙三", grade: "all" },
    "sky@shigaku.local": { name: "Sky", grade: "all" },
    "guest": { name: "ゲストユーザー", grade: "all" }
  };
  const REGISTERED_STUDENTS = Object.keys(STUDENT_RECORDS);

  let currentModalStudentId = ""; 
  let allRecentRecords = []; 

  async function uploadPdfToStorage(file) {
    const fileName = `${Date.now()}_${file.name}`;
    const storageRef = ref(storage, `pdfs/${fileName}`);
    await uploadBytes(storageRef, file);
    return await getDownloadURL(storageRef);
  }

  // ★追加機能：過去のメッセージを読み込んで表示し、削除できるようにする処理
  async function loadSentMessages(studentId) {
    const listContainer = document.getElementById('sent-messages-list');
    listContainer.innerHTML = '<div style="color:#888;">読み込み中...</div>';
    
    try {
      // ★生徒の学年を名簿から逆引きする
      const studentInfo = STUDENT_RECORDS[studentId] || { grade: "none" };
      const myGrade = studentInfo.grade;

      // ★検索範囲を拡大：本人宛 OR 自分の学年宛 OR 全員(all)宛 を取得
      const q = query(collection(db, "teacher_messages"), 
                      where("target", "in", [studentId, myGrade, "all"]));
      const querySnapshot = await getDocs(q);
      
      let msgs = [];
      querySnapshot.forEach(d => {
        msgs.push({ id: d.id, ...d.data() });
      });
      
      msgs.sort((a, b) => {
        let timeA = a.timestamp ? (typeof a.timestamp.toDate === 'function' ? a.timestamp.toDate().getTime() : new Date(a.timestamp).getTime()) : 0;
        let timeB = b.timestamp ? (typeof b.timestamp.toDate === 'function' ? b.timestamp.toDate().getTime() : new Date(b.timestamp).getTime()) : 0;
        return timeB - timeA;
      });

      if(msgs.length === 0) {
        listContainer.innerHTML = '<div style="color:#888;">送信済みのメッセージはありません</div>';
        return;
      }

      listContainer.innerHTML = '';
      msgs.forEach(msg => {
        let dateStr = "日付不明";
        if(msg.timestamp) {
          let dateObj = typeof msg.timestamp.toDate === 'function' ? msg.timestamp.toDate() : new Date(msg.timestamp);
          dateStr = dateObj.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }
        
        const div = document.createElement('div');
        div.style.cssText = "display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:5px 0;";
        
        // 宛先がどこ宛かを表示（オプション）
        const targetLabel = msg.target === 'all' ? '[全員]' : (msg.target.startsWith('grade') ? '['+msg.target+']' : '');
        
        div.innerHTML = `
          <div style="flex:1; padding-right:10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            <span style="color:#555;">${dateStr}</span> 
            <span style="color:#2980b9; font-weight:bold;">${targetLabel}</span> 
            <strong style="color:#333; margin-left:5px;">${msg.message || '添付ファイルのみ'}</strong>
          </div>
          <button class="delete-msg-btn" data-id="${msg.id}" data-url="${msg.pdfUrl || ''}" style="background:#e74c3c; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.9em;">削除</button>
        `;
        listContainer.appendChild(div);
      });

      // 削除ボタンのイベントリスナー設定
      document.querySelectorAll('.delete-msg-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const docId = e.target.getAttribute('data-id');
          const pdfUrl = e.target.getAttribute('data-url');
          if(confirm("このデータを完全に削除しますか？")) {
            try {
              if(pdfUrl) {
                try { await deleteObject(ref(storage, pdfUrl)); } catch(err) { console.warn("Storage削除失敗", err); }
              }
              await deleteDoc(doc(db, "teacher_messages", docId));
              loadSentMessages(studentId); // リスト再読み込み
            } catch(err) { alert("削除失敗: " + err.message); }
          }
        });
      });
    } catch(e) {
      listContainer.innerHTML = '<div style="color:#e74c3c;">読み込み失敗</div>';
      console.error(e);
    }
  }

  async function initDashboard(forceUpdate = false) {
    document.getElementById('loading-view').style.display = 'block';
    document.getElementById('student-table').style.display = 'none';
    
    const cachedTime = localStorage.getItem('mystudy_cache_time');
    const cachedMap = localStorage.getItem('mystudy_student_map');
    const cachedRec = localStorage.getItem('mystudy_recent_records');
    
    const nowMs = Date.now();
    const CACHE_MINUTES = 30;
    const expireMs = CACHE_MINUTES * 60 * 1000;

    if (!forceUpdate && cachedTime && cachedMap && cachedRec && (nowMs - parseInt(cachedTime)) < expireMs) {
        const studentMap = JSON.parse(cachedMap);
        allRecentRecords = JSON.parse(cachedRec);
        
        const dateObj = new Date(parseInt(cachedTime));
        document.getElementById('last-update-time').textContent = dateObj.toLocaleTimeString('ja-JP');
        
        const studentList = Object.values(studentMap);
        sortAndRender(studentList, 'count7');
        
        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('student-table').style.display = 'table';
        return;
    }

    document.getElementById('loading-view').textContent = "⏳ Firebaseから最新データを集計中...";
    await fetchFromFirebaseAndAggregate();
  }

  async function fetchFromFirebaseAndAggregate() {
    try {
      const now = new Date();
      const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

      const q = query(collection(db, "learning_records"), where("timestamp", ">=", thirtyDaysAgo));
      const querySnapshot = await getDocs(q);

      allRecentRecords = []; 
      const studentMap = {};
      REGISTERED_STUDENTS.forEach(id => {
        studentMap[id] = { id: id, count7: 0, count30: 0, lastActiveMs: null, subjects: {} };
      });

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.action === "学習開始" || data.questionId === "アクセス") return; 

        let sId = data.studentId;
        if (sId) {
          if (sId === "ゲスト" || sId === "guest") sId = "guest";
          else if (!sId.includes('@')) sId = sId + '@shigaku.local'; 
        } else {
          sId = "unknown";
        }

        if (!studentMap[sId]) studentMap[sId] = { id: sId, count7: 0, count30: 0, lastActiveMs: null, subjects: {} };

        let timestampMs = null;
        if (data.timestamp) {
            if (typeof data.timestamp.toDate === 'function') timestampMs = data.timestamp.toDate().getTime(); 
            else {
                const tmpDate = new Date(data.timestamp); 
                if (!isNaN(tmpDate.getTime())) timestampMs = tmpDate.getTime(); 
            }
        }

        if (timestampMs) {
          allRecentRecords.push({ studentId: sId, subject: data.subject || 'その他/不明', unit: data.unit || '', timestampMs: timestampMs });
          studentMap[sId].count30++;
          if (timestampMs >= sevenDaysAgo.getTime()) studentMap[sId].count7++;
          if (!studentMap[sId].lastActiveMs || timestampMs > studentMap[sId].lastActiveMs) studentMap[sId].lastActiveMs = timestampMs;
          
          const subjectName = data.subject || 'その他/不明';
          if (!studentMap[sId].subjects[subjectName]) studentMap[sId].subjects[subjectName] = 0;
          studentMap[sId].subjects[subjectName]++;
        }
      });

      const nowMs = Date.now();
      localStorage.setItem('mystudy_cache_time', nowMs.toString());
      localStorage.setItem('mystudy_student_map', JSON.stringify(studentMap));
      localStorage.setItem('mystudy_recent_records', JSON.stringify(allRecentRecords));

      const dateObj = new Date(nowMs);
      document.getElementById('last-update-time').textContent = dateObj.toLocaleTimeString('ja-JP');

      const studentList = Object.values(studentMap);
      sortAndRender(studentList, 'count7');

      document.getElementById('loading-view').style.display = 'none';
      document.getElementById('student-table').style.display = 'table';
    } catch (e) {
      console.error("エラー:", e);
      document.getElementById('loading-view').textContent = "❌ 読み込みエラーが発生しました。詳細: " + e.message;
    }
  }

function sortAndRender(list, key, asc = false) {
    list.sort((a, b) => asc ? a[key] - b[key] : b[key] - a[key]);
    const tbody = document.getElementById('student-list');
    tbody.innerHTML = '';
    list.forEach(student => {
      const tr = document.createElement('tr');
      tr.className = 'student-row';
      if (student.count30 === 0) tr.classList.add('zero-activity');

      // ★ここを修正：名簿が新しい形式になったので、.name を指定して取得します
      const studentInfo = STUDENT_RECORDS[student.id];
      const studentName = studentInfo ? studentInfo.name : student.id;
      
      const dateStr = student.lastActiveMs ? new Date(student.lastActiveMs).toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '---';

      tr.innerHTML = `<td><span class="student-name-text">${studentName}</span><span class="student-id-sub">${student.id}</span></td>
                      <td>${student.count7} 回</td><td>${student.count30} 回</td>
                      <td>${dateStr} ${student.count30 === 0 ? '<span class="badge badge-alert">未受講</span>' : ''}</td>`;
      
      tr.addEventListener('click', () => openStudentModal(student, studentName));
      tbody.appendChild(tr);
    });
  }

  let isAsc = false;
  document.getElementById('sort-7days').addEventListener('click', () => {
    isAsc = !isAsc;
    const cachedMap = localStorage.getItem('mystudy_student_map');
    if (cachedMap) {
      const studentList = Object.values(JSON.parse(cachedMap));
      sortAndRender(studentList, 'count7', isAsc);
    }
  });

  const modal = document.getElementById('student-modal');
  const closeBtn = document.getElementById('modal-close-btn');
  closeBtn.onclick = () => modal.style.display = "none";
  window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; }

  function openStudentModal(student, studentName) {
    currentModalStudentId = student.id; 
    
    document.getElementById('modal-name').textContent = studentName;
    document.getElementById('modal-id').textContent = student.id;
    document.getElementById('modal-count7').textContent = student.count7;
    document.getElementById('modal-count30').textContent = student.count30;
    
    document.getElementById('teacher-msg-input').value = "";
    document.getElementById('msg-send-status').textContent = "";
    
    const pdfInputElement = document.getElementById('pdf-upload-input');
    if (pdfInputElement) pdfInputElement.value = "";

    const subjectsContainer = document.getElementById('modal-subjects-container');
    subjectsContainer.innerHTML = '';
    if (student.count30 === 0) {
      subjectsContainer.innerHTML = '<div style="color: #888; font-size: 0.9em;">データがありません</div>';
    } else {
      const sortedSubjects = Object.entries(student.subjects).sort((a, b) => b[1] - a[1]);
      sortedSubjects.forEach(([subjName, count]) => {
        const percentage = Math.round((count / student.count30) * 100);
        let barColor = "#95a5a6";
        if (subjName.includes("英語")) barColor = "#e74c3c";
        else if (subjName.includes("数学") || subjName.includes("算数")) barColor = "#3498db";
        else if (subjName.includes("国語")) barColor = "#e67e22";
        else if (subjName.includes("理科")) barColor = "#2ecc71";
        else if (subjName.includes("社会")) barColor = "#9b59b6";

        subjectsContainer.innerHTML += `
          <div class="subject-bar-container">
            <div class="subject-name"><span>${subjName}</span><span>${count}回 <span style="color:#888; font-size:0.9em; font-weight:normal;">(${percentage}%)</span></span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: ${percentage}%; background-color: ${barColor};"></div></div>
          </div>`;
      });
    }

    const historyList = document.getElementById('modal-recent-list');
    historyList.innerHTML = '';
    modal.style.display = "flex";

    try {
      const shortId = student.id.includes('@') ? student.id.split('@')[0] : student.id;
      const myRecords = allRecentRecords.filter(data => {
         const sId = data.studentId;
         if (!sId) return false;
         return sId === student.id || sId === shortId || (student.id === "guest" && (sId === "ゲスト" || sId === "guest"));
      });

      myRecords.sort((a, b) => b.timestampMs - a.timestampMs);
      const top5 = myRecords.slice(0, 5);

      if (top5.length === 0) {
        historyList.innerHTML = '<li style="color:#888;">学習履歴がありません</li>';
      } else {
        top5.forEach((data) => {
          const dateObj = new Date(data.timestampMs);
          const dateStr = !isNaN(dateObj.getTime()) ? dateObj.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '不明';
          const subject = data.subject || '教科不明';
          const unit = data.unit || '';
          historyList.innerHTML += `<li><span style="color:#666; font-size:0.9em; margin-right:10px;">${dateStr}</span> <strong>${subject}</strong> <br><span style="font-size:0.9em; color:#444;">${unit}</span></li>`;
        });
      }
    } catch (e) {
      console.error(e);
    }

    // ★モーダルを開いたときに、送信済みメッセージを読み込む
    loadSentMessages(student.id);
  }

  document.getElementById('send-msg-btn').addEventListener('click', async () => {
    const msgInput = document.getElementById('teacher-msg-input');
    const statusText = document.getElementById('msg-send-status');
    const targetTypeElement = document.getElementById('msg-target-type');
    const pdfInputElement = document.getElementById('pdf-upload-input');
    
    let message = msgInput.value.trim();
    const hasFile = pdfInputElement && pdfInputElement.files.length > 0;

    if (!message && !hasFile) {
      statusText.textContent = "メッセージを入力するか、PDFを添付してください";
      return;
    }

    if (!message && hasFile) {
      message = "📁 プリントが届きました（添付ファイルを確認してください）";
    }

    statusText.style.color = "#333";
    statusText.textContent = "送信中... (PDFアップロード中はそのままお待ちください)";

    try {
      let pdfUrl = null;

      if (hasFile) {
        const file = pdfInputElement.files[0];
        if (file.type !== "application/pdf") {
           statusText.textContent = "エラー：PDFファイルを選択してください。";
           statusText.style.color = "#e74c3c";
           return;
        }
        pdfUrl = await uploadPdfToStorage(file);
      }

      let target = currentModalStudentId; 
      if (targetTypeElement && targetTypeElement.value !== "individual") {
        target = targetTypeElement.value;
      }

      await addDoc(collection(db, "teacher_messages"), {
        target: target,
        studentId: currentModalStudentId, 
        message: message,
        pdfUrl: pdfUrl,
        isRead: false,
        timestamp: serverTimestamp()
      });

      statusText.style.color = "#27ae60";
      statusText.textContent = "✅ 送信しました！";
      
      msgInput.value = ""; 
      if (pdfInputElement) pdfInputElement.value = ""; 
      if (targetTypeElement) targetTypeElement.value = "individual";

      // ★送信が成功したら、すぐ下のリストを最新状態に更新する
      loadSentMessages(currentModalStudentId);

    } catch (e) {
      console.error(e);
      statusText.style.color = "#e74c3c";
      statusText.textContent = "❌ 送信に失敗しました";
    }
  });

  document.getElementById('force-update-btn').addEventListener('click', () => {
    initDashboard(true);
  });

  initDashboard(false);
</script>
</body>
</html>
